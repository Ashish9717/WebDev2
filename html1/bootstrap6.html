<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms controls</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
        <div class="container ">
                <h2>Form demo</h2>
                <form>
                        <div class="row">
                                 <div class="mb-3 col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="text" placeholder="Email" class="form-control" id="email">
                        </div>
                         <div class="mb-3 col-md-6">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" placeholder="Password" class="form-control" id="password">
                        </div>

                        </div>
                       

                       
                        <div class="mb3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" placeholder="Address" class="form-control-sm" id="address">
                        </div>
                        <div class="mb-3">
                                <select class="form-select">
                                        <option selected>Choose your city </option>
                                        <option value="1">Mumbai</option>
                                        <option value="2">Delhi</option>
                                        <option value="3">pune</option>
                                </select>
                        </div>
                        <div class=" mb-3 form-check">
                                <input type="checkbox" id="agree" class="form-check-input">
                                <label for="agree" class="form-check-label">Agree</label>
                        </div>
                        <div class=" mb-3 form-check">
                                <input type="radio" id="radiobs" class="form-check-input">
                                <label for="radiobs" class="form-check-label">Agree</label>
                        </div>
                        <div class=" mb-3 form-check form-switch">
                                <input type="checkbox" id="forcheckbox" class="form-check-input">
                                <label for="forcheckbox" class="form-check-label">checkboxinput</label>
                        </div>

                </form>
        </div>

</body>

</html>
